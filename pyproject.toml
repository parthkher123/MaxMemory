[project]
name = "memory-mcp"
version = "0.1.0"
description = "Graph + vector memory layer for LLM agents, exposed over MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",
    "anthropic>=0.40.0",
    "neo4j>=5.26.0",
    "qdrant-client>=1.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
memory-mcp = "memory_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
